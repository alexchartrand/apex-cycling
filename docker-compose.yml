services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-track_trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-track_trainer}
      POSTGRES_DB: ${POSTGRES_DB:-track_trainer}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-track_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-track_trainer}:${POSTGRES_PASSWORD:-track_trainer}@db:5432/${POSTGRES_DB:-track_trainer}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-any-real-deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-track_trainer}:${POSTGRES_PASSWORD:-track_trainer}@db:5432/${POSTGRES_DB:-track_trainer}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    # backend runs migrations on start; restart if the worker's first poll
    # races ahead of them and hits missing tables.
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
