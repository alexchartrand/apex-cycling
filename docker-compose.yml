services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex_cycling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex_cycling}
      POSTGRES_DB: ${POSTGRES_DB:-apex_cycling}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex_cycling}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apex_cycling}:${POSTGRES_PASSWORD:-apex_cycling}@db:5432/${POSTGRES_DB:-apex_cycling}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-any-real-deployment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "http://127.0.0.1:5173"]}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apex_cycling}:${POSTGRES_PASSWORD:-apex_cycling}@db:5432/${POSTGRES_DB:-apex_cycling}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    # backend runs migrations on start; restart if the worker's first poll
    # races ahead of them and hits missing tables.
    restart: "on-failure:5"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db_data:
