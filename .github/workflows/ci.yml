name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest

  # Tests run on in-memory SQLite, so this is the only place the hand-written
  # Postgres migrations actually execute before a deploy. `alembic check`
  # fails if a model changed without a matching migration.
  backend-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex_cycling
          POSTGRES_PASSWORD: apex_cycling
          POSTGRES_DB: apex_cycling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_cycling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://apex_cycling:apex_cycling@localhost:5432/apex_cycling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The prod stack can't be deployed from CI, but its config can be checked:
  # compose interpolation, the Caddyfile and the shell scripts' syntax.
  prod-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.prod.example .env.prod
          sed -i -e 's/^JWT_SECRET=$/JWT_SECRET=ci/' -e 's/^DATA_ENCRYPTION_KEY=$/DATA_ENCRYPTION_KEY=ci/' -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' -e 's/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
      - run: |
          docker run --rm -e ACME_EMAIL=ci@example.com -e DOMAIN=example.com \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - run: for f in scripts/*.sh docker/backup.sh; do bash -n "$f"; done
