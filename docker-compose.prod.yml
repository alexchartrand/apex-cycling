name: apex-cycling-prod

# Single-host production stack (a VPS with nothing else on it).
# Caddy publishes 80/443 and gets its own Let's Encrypt certificate; db,
# backend and worker are only reachable on the private compose network.
# Always run through scripts/deploy.sh (or `docker compose --env-file .env.prod`).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-apex_cycling}:${POSTGRES_PASSWORD:?set a real Postgres password in .env.prod}@db:5432/${POSTGRES_DB:-apex_cycling}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex_cycling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real Postgres password in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-apex_cycling}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex_cycling} -d ${POSTGRES_DB:-apex_cycling}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    image: apex-cycling-backend:${APP_TAG:-latest}
    environment:
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in .env.prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://${DOMAIN:-localhost}"]}
      APP_BASE_URL: ${APP_BASE_URL:-https://${DOMAIN:-localhost}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Trust X-Forwarded-* only from the edge container (the compose
      # network below), so rate limits key on the real client address and a
      # spoofed header from the internet is ignored.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
      LOG_FORMAT: json
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    logging: *logging
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.prod.Dockerfile
    image: apex-cycling-worker:${APP_TAG:-latest}
    environment:
      DATABASE_URL: *db-url
      SQORZ_POLL_INTERVAL_MINUTES: ${SQORZ_POLL_INTERVAL_MINUTES:-20}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # The worker touches this file every minute (app/ingestion/heartbeat.py).
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
      args:
        # Same-origin build (see docker/Caddyfile): Caddy proxies /api to
        # backend and serves this bundle for everything else on one
        # origin, so leave this blank.
        VITE_API_URL: ""
    image: apex-cycling-frontend:${APP_TAG:-latest}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod (Let's Encrypt expiry notices)}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      # IPv4 only, on purpose: Docker serves IPv6 through a userland proxy that
      # hides the client address, which would put every IPv6 visitor in one
      # rate-limit bucket. Publish an A record only (no AAAA).
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
      - "0.0.0.0:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 172.28.0.10
    logging: *logging
    restart: unless-stopped

  # Daily pg_dump + uploads archive with rotation (docker/backup.sh).
  # `scripts/restore.sh` puts a backup back.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: apex-cycling-backup:${APP_TAG:-latest}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-apex_cycling}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set a real Postgres password in .env.prod}
      PGDATABASE: ${POSTGRES_DB:-apex_cycling}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      # Optional off-host copy to any S3-compatible store (OVH Object Storage,
      # Backblaze B2, AWS S3…) — see README.
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_DIR:-/var/backups/apex-cycling}:/backups
      - uploads:/data/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Fails if the last successful backup is older than 26 h.
      test: ["CMD-SHELL", "test -n \"$(find /backups/last-success -mmin -1560 2>/dev/null)\" || test -n \"$(find /tmp/started -mmin -1560 2>/dev/null)\""]
      interval: 1h
      timeout: 5s
      retries: 1
      # Without these, `up --wait` would block until the first hourly check.
      start_period: 30s
      start_interval: 3s
    logging: *logging
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so FORWARDED_ALLOW_IPS and the edge's address are known. Pick
        # another range here if it overlaps a network your host routes to.
        - subnet: 172.28.0.0/24

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
